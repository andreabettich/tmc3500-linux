[package]
name = "tmc3500-backend"
description = "CUPS backend for the Epson TM-C3500 (tmc3500://host[:port])"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "tmc3500"
path = "src/main.rs"

[dependencies]
tmc3500-core = { path = "../tmc3500-core" }
tmc3500-common = { path = "../tmc3500-common" }
signal-hook = "0.4"

[dev-dependencies]
tmc3500-fakeprinter = { path = "../tmc3500-fakeprinter" }
tempfile = "3"
serde_json = "1"
