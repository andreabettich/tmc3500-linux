[package]
name = "tmc3500ctl"
description = "Admin CLI for the Epson TM-C3500 driver (status, ink, counters, setup, held jobs)"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
tmc3500-core = { path = "../tmc3500-core" }
tmc3500-common = { path = "../tmc3500-common" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tmc3500-fakeprinter = { path = "../tmc3500-fakeprinter" }
tempfile = "3"
