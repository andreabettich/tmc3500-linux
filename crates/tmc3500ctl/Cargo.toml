[package]
name = "tmc3500ctl"
description = "Admin CLI for the Epson TM-C3500 driver (status, ink, counters, setup, held jobs)"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
tmc3500-core = { path = "../tmc3500-core" }
tmc3500-common = { path = "../tmc3500-common" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tmc3500-fakeprinter = { path = "../tmc3500-fakeprinter" }
tempfile = "3"

[package.metadata.deb]
name = "tmc3500"
maintainer = "TM-C3500 Linux driver maintainers"
copyright = "2026, TM-C3500 Linux driver contributors"
extended-description = """\
CUPS driver for the Epson TM-C3500 ColorWorks label printer: raster filter (rastertotmc3500), \
network backend with status monitoring and job holding (tmc3500), idle status monitor with alerts \
and Prometheus metrics (tmc3500-monitor), and an admin CLI (tmc3500ctl). Contains no Epson files."""
depends = "$auto, cups (>= 2.2), cups-filters, adduser"
suggests = "msmtp, curl, prometheus-node-exporter"
section = "text"
priority = "optional"
maintainer-scripts = "../../packaging/debian/"
conf-files = ["/etc/tmc3500/tmc3500.toml", "/etc/tmc3500/alert.d/50-syslog", "/etc/tmc3500/alert.d/60-mail", "/etc/tmc3500/alert.d/70-webhook", "/etc/apparmor.d/tmc3500"]
assets = [
    ["target/release/rastertotmc3500", "usr/lib/cups/filter/", "755"],
    ["target/release/tmc3500", "usr/lib/cups/backend/", "755"],
    ["target/release/tmc3500-monitor", "usr/bin/", "755"],
    ["target/release/tmc3500ctl", "usr/bin/", "755"],
    ["../../packaging/ppd/tmc3500.ppd", "usr/share/ppd/tmc3500/", "644"],
    ["../../packaging/tmc3500.toml", "etc/tmc3500/", "644"],
    ["../../packaging/alert.d/50-syslog", "etc/tmc3500/alert.d/", "755"],
    ["../../packaging/alert.d/60-mail", "etc/tmc3500/alert.d/", "755"],
    ["../../packaging/alert.d/70-webhook", "etc/tmc3500/alert.d/", "755"],
    ["../../packaging/apparmor/tmc3500", "etc/apparmor.d/", "644"],
    ["../../packaging/colour/README", "usr/share/tmc3500/colour/", "644"],
    ["../../docs/operations.md", "usr/share/doc/tmc3500/", "644"],
]
systemd-units = { unit-name = "tmc3500-monitor", unit-scripts = "../../packaging/systemd", enable = false, start = false }
