[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/tmc3500-core",
    "crates/rastertotmc3500",
    "crates/xtask",
    "crates/tmc3500-common",
    "crates/tmc3500-fakeprinter",
    "crates/tmc3500-backend",
    "crates/tmc3500-monitor",
    "crates/tmc3500ctl",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[profile.release]
panic = "abort"
lto = true
strip = true
